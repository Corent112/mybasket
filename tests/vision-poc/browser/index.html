<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBasket RF-DETR – test local</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px}
canvas{max-width:100%;border:1px solid #ddd}.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}
</style>
</head><body>
<h1>MyBasket – RF-DETR ONNX local</h1>
<p>Le modèle et l'image restent dans le navigateur. Aucun appel API.</p>
<div class="row">
<label>Modèle ONNX <input id="model" type="file" accept=".onnx"></label>
<label>Image <input id="image" type="file" accept="image/*"></label>
<label>Seuil <input id="thr" type="number" min="0.05" max="0.95" step="0.05" value="0.30"></label>
<button id="run">Analyser</button>
</div>
<canvas id="cv"></canvas><pre id="log">Prêt.</pre>
<script>
const CLASS_NAMES=["attacker","ball_carrier","defender","ball","cone"];
const MEAN=[0.485,0.456,0.406], STD=[0.229,0.224,0.225];
const $=id=>document.getElementById(id);
const sigmoid=x=>{x=Math.max(-88,Math.min(88,x));return 1/(1+Math.exp(-x));};
const xyxy=(b,w,h)=>[(b[0]-b[2]/2)*w,(b[1]-b[3]/2)*h,(b[0]+b[2]/2)*w,(b[1]+b[3]/2)*h];
function resizeHalfPixel(src,sw,sh,tw,th){
 const out=new Float32Array(3*tw*th);
 for(let oy=0;oy<th;oy++){
  const fy=(oy+.5)*sh/th-.5, yb=Math.floor(fy), y0=Math.max(0,yb), y1=Math.min(sh-1,yb+1), wy=fy-yb;
  for(let ox=0;ox<tw;ox++){
   const fx=(ox+.5)*sw/tw-.5, xb=Math.floor(fx), x0=Math.max(0,xb), x1=Math.min(sw-1,xb+1), wx=fx-xb;
   for(let c=0;c<3;c++){
    const at=(x,y)=>src[(y*sw+x)*4+c]/255;
    const top=at(x0,y0)+(at(x1,y0)-at(x0,y0))*wx;
    const bot=at(x0,y1)+(at(x1,y1)-at(x0,y1))*wx;
    out[c*tw*th+oy*tw+ox]=((top+(bot-top)*wy)-MEAN[c])/STD[c];
   }
  }
 }
 return out;
}
$("run").onclick=async()=>{
 try{
  const mf=$("model").files[0], imf=$("image").files[0];
  if(!mf||!imf) throw new Error("Choisis le .onnx et une image.");
  $("log").textContent="Chargement…";
  const bytes=await mf.arrayBuffer();
  let session;
  try{session=await ort.InferenceSession.create(bytes,{executionProviders:["webgpu","wasm"]});}
  catch{session=await ort.InferenceSession.create(bytes,{executionProviders:["wasm"]});}
  const inputName=session.inputNames[0];
  const meta=session.inputMetadata[inputName];
  const dims=meta.dimensions||meta.dims;
  const H=Number(dims[dims.length-2]), W=Number(dims[dims.length-1]);
  if(!Number.isFinite(H)||!Number.isFinite(W)) throw new Error("Dimensions ONNX dynamiques non gérées.");
  const bmp=await createImageBitmap(imf), c=$("cv"), ctx=c.getContext("2d");
  c.width=bmp.width;c.height=bmp.height;ctx.drawImage(bmp,0,0);
  const src=ctx.getImageData(0,0,c.width,c.height).data;
  const input=new ort.Tensor("float32",resizeHalfPixel(src,c.width,c.height,W,H),[1,3,H,W]);
  const out=await session.run({[inputName]:input});
  let boxes=out.dets, logits=out.labels;
  if(!boxes||!logits){
   const vals=Object.values(out);
   boxes=vals.find(t=>t.dims.length===3&&t.dims[2]===4);
   logits=vals.find(t=>t!==boxes&&t.dims.length===3);
  }
  if(!boxes||!logits) throw new Error("Sorties RF-DETR introuvables.");
  const Q=boxes.dims[1], LC=logits.dims[2], C=Math.min(CLASS_NAMES.length,LC-1), thr=Number($("thr").value);
  const pred=[];
  for(let q=0;q<Q;q++) for(let cl=0;cl<C;cl++){
   const s=sigmoid(logits.data[q*LC+cl]);
   if(s>=thr){
    const i=q*4;
    pred.push({score:s,cls:cl,box:[boxes.data[i],boxes.data[i+1],boxes.data[i+2],boxes.data[i+3]]});
   }
  }
  pred.sort((a,b)=>b.score-a.score);
  const keep=pred.slice(0,Q);
  ctx.lineWidth=3;ctx.font="16px system-ui";
  for(const p of keep){
   const [x1,y1,x2,y2]=xyxy(p.box,c.width,c.height);
   ctx.strokeStyle="red";ctx.fillStyle="red";ctx.strokeRect(x1,y1,x2-x1,y2-y1);
   ctx.fillText(`${CLASS_NAMES[p.cls]} ${p.score.toFixed(2)}`,x1,Math.max(16,y1-4));
  }
  $("log").textContent=JSON.stringify(keep.map(p=>({class:CLASS_NAMES[p.cls],score:+p.score.toFixed(3),box:p.box})),null,2);
 }catch(e){$("log").textContent="ERREUR: "+(e?.stack||e);}
};
</script></body></html>
